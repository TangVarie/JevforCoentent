name: external-corpus
# 每周一 03:07 UTC（北京时间 11:07）抓一次外部语料。量级和预算在 config/external_corpus.yaml，这里只管频率。
# 分钟故意不取 0：GitHub 整点的定时队列最挤、漂得最厉害（TV 的 daily-sync 02:17 实际 08:04–09:00 才起），错开一点。
# 顺序：从 TV 拉已入库的外部笔记 id（第二道去重）→ 抓取 → 先上传产物（哪怕后面失败）→ 经 PostgREST 写库（没配密钥就跳过并提示）。
# ⚠️ 写库失败让 job 红（2026-10-08，TV 审计 A-08）。以前这一步 continue-on-error：job 绿、actions/cache 把 run 步已经存好的
#   seen state 保存下来、而账本里没有这批笔记（known_ids 也不会有）→ 下周按 seen 跳过、永远不再抓 —— 那一周的钱和笔记静默丢掉，
#   唯一痕迹是 artifact。现在 job 红 = cache 不保存 = state 回到上周 = 下周重抓这批（多花一次钱，不丢）；邮件发给改过 cron 那行的人。
# state 靠 actions/cache：每次存一个新 key、按前缀恢复最近一份；GitHub 会淘汰 7 天没访问的缓存，周更卡在线上，所以另有 known_ids 兜底。
# 注意：含 ${{ … }} 的值不能写在 {…} 流式映射里（YAML 会把 { 当嵌套映射，GitHub 直接拒绝整个文件），一律用块式 + 引号。
on:
  schedule:
    - cron: "7 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只算计划不联网"
        default: "false"
      fresh_state:
        description: "不恢复上次的去重 state（从库里删掉一批数据后重抓用；账本里已有的仍靠 known_ids 去重）"
        default: "false"
# 同一时间只跑一个：手动触发撞上定时跑的话，两个 run 会各自恢复同一份 state、各花一遍钱、后存的 cache 盖掉先存的。
concurrency:
  group: external-corpus
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}   # 与 TV 同名，Railway / Actions 一份配置两边用
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: restore state
        uses: actions/cache@v4
        with:
          path: state
          # 带 run_attempt：同一个 run 重跑时 run_id 不变，不带的话主 key 会命中第一次存的 state，fresh_state 就失效了
          key: "external-corpus-state-${{ github.run_id }}-${{ github.run_attempt }}"
          # fresh_state=true 时给一个永远命中不了的前缀：不恢复，但跑完照样存一份新的
          restore-keys: "${{ github.event.inputs.fresh_state == 'true' && 'external-corpus-fresh-' || 'external-corpus-state-' }}"
      - name: known ids from TV (second dedupe; state cache can be evicted after 7 idle days)
        if: github.event.inputs.dry_run != 'true'
        run: python3 scripts/known_external_ids.py state/known_ids.txt
      - name: plan only (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: python3 scripts/external_corpus.py --dry-run
      - name: run
        if: github.event.inputs.dry_run != 'true'
        run: |
          mkdir -p out
          python3 scripts/external_corpus.py --known-ids state/known_ids.txt --out out/report.md --sql out/answers.sql --notes-sql out/external_notes.sql --rows out/rows.json --raw out/kept.json
      - name: upload products (even if a later step fails)
        if: always() && hashFiles('out/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: "external-corpus-${{ github.run_id }}"
          path: out
      - name: write to db via PostgREST (skipped with a notice when the key is absent; needs TV notes_v1_17 + v1_18; failure makes the job red so the cache does not keep a seen-but-unwritten state)
        if: always() && github.event.inputs.dry_run != 'true' && hashFiles('out/rows.json') != ''
        run: python3 scripts/apply_rows.py out/rows.json
