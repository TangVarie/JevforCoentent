name: external-corpus
# 每周一、周四 03:07 UTC（北京时间 11:07）各抓一次外部语料（2026-11-03 起；以前每周一一次）。量级和预算在 config/external_corpus.yaml，这里只管频率。
# 一周两次是为了新帖早几天进书架：一个项目一个周期约一个月，等一周才见到新外部参考太慢。再密（每天）每月最坏要 130 多美元，而同一组关键词隔天搜大多是看过的帖。
# 分钟故意不取 0：GitHub 整点的定时队列最挤、漂得最厉害（TV 的 daily-sync 02:17 实际 08:04–09:00 才起），错开一点。
# 顺序：先查写库密钥（缺就红，一次付费调用都不发）→ 从 TV 拉已入库的外部笔记 id（第二道去重）→ 抓取 → 先上传产物（哪怕后面失败）→ 经 PostgREST 写库。
# ⚠️ 缺 SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY 时一开始就红（2026-11-04，审计 11-02 F16）。以前照样先花钱抓取、判定，写库那步打一行提示退 0、
#   job 照绿、cache 把 seen state 存下来，下周这批被跳过，只剩 artifact 能手动重放。现在 known_ids / 写库两个脚本在 Actions 里缺密钥也退非零。
# ⚠️ 写库失败让 job 红（2026-10-08，TV 审计 A-08）。以前这一步 continue-on-error：job 绿、actions/cache 把 run 步已经存好的
#   seen state 保存下来、而账本里没有这批笔记（known_ids 也不会有）→ 下周按 seen 跳过、永远不再抓 —— 那一周的钱和笔记静默丢掉，
#   唯一痕迹是 artifact。现在 job 红 = cache 不保存 = state 回到上周 = 下周重抓这批（多花一次钱，不丢）；邮件发给改过 cron 那行的人。
# state 靠 actions/cache：每次存一个新 key、按前缀恢复最近一份；GitHub 会淘汰 7 天没访问的缓存，两次跑最多隔 4 天（周四 → 周一），漏跑一次也还在 7 天里；另有 known_ids 兜底。
# 注意：含 ${{ … }} 的值不能写在 {…} 流式映射里（YAML 会把 { 当嵌套映射，GitHub 直接拒绝整个文件），一律用块式 + 引号。
on:
  schedule:
    - cron: "7 3 * * 1,4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只算计划不联网"
        default: "false"
      fresh_state:
        description: "不恢复上次的去重 state（从库里删掉一批数据后重抓用；账本里已有的仍靠 known_ids 去重）"
        default: "false"
# 同一时间只跑一个：手动触发撞上定时跑的话，两个 run 会各自恢复同一份 state、各花一遍钱、后存的 cache 盖掉先存的。
concurrency:
  group: external-corpus
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}   # 与 TV 同名，Railway / Actions 一份配置两边用
    steps:
      # TEMP 11-27 诊断 (只在开发分支上, 用完即撤): 只跑 scripts/tikhub_probe.py, 不恢复 / 不存 state、不写库、不调 Jev
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: TikHub search probe (TEMP)
        run: python3 scripts/tikhub_probe.py
