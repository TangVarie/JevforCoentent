name: external-corpus
# 每周一 03:00 UTC（北京时间 11:00）抓一次外部语料。量级和预算在 config/external_corpus.yaml，这里只管频率。
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run: {description: "只算计划不联网", default: "false"}
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: restore state
        uses: actions/cache@v4
        with: {path: state, key: external-corpus-state-${{ github.run_id }}, restore-keys: external-corpus-state-}
      - name: run
        env:
          TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          mkdir -p out
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then python3 scripts/external_corpus.py --dry-run; exit 0; fi
          python3 scripts/external_corpus.py --out out/report.md --sql out/answers.sql --notes-sql out/external_notes.sql --raw out/kept.json
          echo "EXTERNAL_CORPUS_DONE rc=$?"
      - name: write to db (only if service key present)
        if: ${{ env.SUPABASE_SERVICE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/apply_sql.py out/external_notes.sql out/answers.sql
      - uses: actions/upload-artifact@v4
        with: {name: external-corpus-${{ github.run_id }}, path: out}
