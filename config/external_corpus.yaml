# ════════════════════════════════════════════════════════════════════
# 外部语料 · 抓取配置（量级和频率都在这里，改这里不改代码）
# ════════════════════════════════════════════════════════════════════
# 费用口径（TikHub，2026-09 官网）：每次请求 0.01 美元，搜索按页计费，笔记详情按条计费，默认 10 次/秒。
# 一次运行的花费 ≈ 搜索页数 × 0.01 + 取全文的笔记数 × 0.01；Jev 的费用忽略不计（每篇约 3 次调用、万分之一美元）。
# 下面的默认值：5 个品类 × 4 个关键词 × 2 种排序 × 2 页 = 80 次搜索（0.8 美元）→ 约 1,600 条候选 → 分诊留下约 1/3 →
# 但每品类每周最多只取 40 篇全文（0.4 美元）→ 每周约 2.8 美元、每月约 12 美元、每品类每月 160 篇。
# 关键词从各项目的 target_blue_keywords 和运营给的品类词里挑；先少后多。
# ════════════════════════════════════════════════════════════════════

provider: tikhub                     # tikhub | socialdatax
platform: xiaohongshu
schedule: weekly                     # 只是给人看的；真正的频率在 .github/workflows/external-corpus.yml 的 cron 里
budget_usd_per_run: 4.0              # 一次运行的硬上限，超过就停并写进报告
price_per_call_usd: 0.01
sorts: [popularity_descending, general]   # 一半高互动、一半综合，保证有对照组
pages_per_sort: 2                    # 每个关键词每种排序取几页
note_type: 普通笔记                  # 不限 / 普通笔记 / 视频笔记
keep_voices: [普通用户]              # 分诊后留哪些视角；要达人也留就加「达人测评」
max_keep_per_category_per_run: 40    # 每品类每次运行最多取几篇全文
max_keep_per_category_per_month: 160
min_body_chars: 60                   # 摘要短于这个的先取全文再判（全文也短就丢）

categories:
  - name: 戒烟
    keywords: [戒烟, 戒烟第几天, 尼古丁咀嚼胶, 电子烟戒烟]
  - name: 鼻炎
    keywords: [鼻炎喷雾, 过敏性鼻炎, 布地奈德, 鼻炎自救]
  - name: 运动补给
    keywords: [能量胶, 马拉松补给, 越野跑补给, 骑行补给]
  - name: 术后营养
    keywords: [术后营养, 蛋白粉难喝, 骨折恢复饮食, 特医食品]
  - name: 求职留学
    keywords: [留学生秋招, 求职机构, 简历修改, 海归求职]
