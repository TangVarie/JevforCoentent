# ════════════════════════════════════════════════════════════════════
# 外部语料 · 抓取配置（量级和频率都在这里，改这里不改代码）
# ════════════════════════════════════════════════════════════════════
# 费用口径（TikHub，2026-09 官网）：每次请求 0.01 美元，搜索按页计费，笔记详情按条计费，默认 10 次/秒。
# 一次运行的花费 ≈ 搜索页数 × 0.01 + 取全文的笔记数 × 0.01；Jev 的费用忽略不计（每篇约 3 次调用、万分之一美元）。
# 下面的默认值（2026-11-02 起 8 个品类）：8 个品类 × 4 个关键词 × 2 种排序 × 2 页 = 128 次搜索（1.28 美元）→ 约 2,560 条候选 →
# 分诊留下约 1/3 → 但每品类每次最多只取 40 篇全文（8 × 40 = 320 次，3.2 美元）→ 一次最坏 448 次请求 ≈ 4.5 美元；
# 每月最坏按 9 次算（2026-11-03 起 cron 每周一、周四各跑一次，一个月最多 9 次，如 2026-11 的 2、5、9、12、16、19、23、26、30 日）：
# 9 × 4.48 ≈ 40.3 美元，搜索 1152 页、取全文 2,880 次；平均每月约 8.7 次时约 39 美元。手动触发（workflow_dispatch）的每次另算。
# 每品类每月 360 篇（= 9 次 × 40 篇，定时跑的月上限拦不住任何一次；8 × 360 = 2,880 篇）只封顶入库篇数，不封顶取全文次数和花费。
# 一周两次的实际花费比一周一次的两倍少：同一组关键词隔三四天再搜，大半是看过的帖（state + known_ids 去重，不再取全文），
# 新帖少的品类留不满 40 篇，花的主要是搜索页（每品类每次最多 16 页 = 0.16 美元）。
# 实际比最坏少，因为到每次上限的品类就停搜：2026-10 的 6 次运行（5 个品类）每品类只用到前一两个关键词（2～3 组「关键词 × 排序」），
# 每品类每次入库 31～40 篇、每次合计 178～200 篇；照这个量推 8 个品类，每品类约 40 次取全文 + 4～8 页搜索，一次约 3.5～3.9 美元。
# budget_usd_per_run 要不低于最坏花费（4.48 ≤ 6.0）：比最坏还低的话，排在后面的品类会被预算截掉（4.0 时最坏情况会截到排最后的藻油）。
# 关键词从各项目的 target_blue_keywords 和运营给的品类 / 方向词里挑；先少后多。只放通用的品类词、用途词，不放品牌名（仓库公开）。
# 品类名是外部表 category 列的值：TV 的 prompts/external_shelf_v1.json（外部参考书架，品类 → 我们的品牌）要一字不差地补同名一行。
# ════════════════════════════════════════════════════════════════════

provider: tikhub                     # tikhub | socialdatax
platform: xiaohongshu
schedule: twice_weekly               # 只是给人看的（周一、周四）；真正的频率在 .github/workflows/external-corpus.yml 的 cron 里
budget_usd_per_run: 6.0              # 一次运行的硬上限，超过就停并写进报告；要不低于最坏花费（见上，tests 钉住）
price_per_call_usd: 0.01
sorts: [popularity_descending, general]   # 一半高互动、一半综合，保证有对照组
pages_per_sort: 2                    # 每个关键词每种排序取几页
note_type: 普通笔记                  # 不限 / 普通笔记 / 视频笔记
keep_voices: [普通用户]              # 分诊后留哪些视角；要达人也留就加「达人测评」
max_keep_per_category_per_run: 40    # 每品类每次运行最多取几篇全文
max_keep_per_category_per_month: 360   # = 一个月最多 9 次定时跑 × 40；改 cron 要跟着改（tests 钉住）
min_body_chars: 60                   # 分诊通过的一律取全文（搜索摘要被截在 60 字）；全文短于这个就丢

categories:
  - name: 戒烟
    keywords: [戒烟, 戒烟第几天, 尼古丁咀嚼胶, 电子烟戒烟]
  - name: 鼻炎
    keywords: [鼻炎喷雾, 过敏性鼻炎, 布地奈德, 鼻炎自救]
  - name: 运动补给
    keywords: [能量胶, 马拉松补给, 越野跑补给, 骑行补给]
  - name: 术后营养
    keywords: [术后营养, 蛋白粉难喝, 骨折恢复饮食, 特医食品]
  - name: 求职留学
    keywords: [留学生秋招, 求职机构, 简历修改, 海归求职]
  - name: 家居家电                     # 按摩椅 / 在家放松
    keywords: [按摩椅, 家用按摩椅, 给爸妈买按摩椅, 按摩椅值不值得买]
  - name: 个护                         # 痘痘贴 / 局部祛痘护理
    keywords: [痘痘贴, 痘痘贴怎么用, 破皮痘痘护理, 红肿痘痘急救]
  - name: 藻油                         # DHA 藻油：儿童 / 孕期 / 成人
    keywords: [藻油DHA, 儿童藻油, 孕期DHA, 成人藻油]
